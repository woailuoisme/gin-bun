# Configuration for vektra/mockery v3
# https://github.com/vektra/mockery

dir: "tests/testkit/mocks"
pkgname: "mocks"
filename: "mock_{{.InterfaceName}}.go"
structname: "Mock{{.InterfaceName}}"
include-auto-generated: true

packages:
  lfiber/internal/database:
    interfaces:
      Connection:
      TransactionManager:
  lfiber/internal/infra/mail:
    interfaces:
      Mailer:
      Mailable:
  lfiber/internal/infra/cache:
    interfaces:
      Client:
        config:
          structname: "MockCacheClient"
          filename: "mock_cache_client.go"
  lfiber/internal/infra/auth:
    interfaces:
      TokenBlacklistStore:
      Authorizer:
      UserProvider:
      Authenticatable:
      Guard:
  lfiber/internal/infra/notification/contract:
    interfaces:
      Channel:
        config:
          structname: "MockNotificationChannel"
          filename: "mock_notification_channel.go"
      Notification:
        config:
          structname: "MockNotification"
          filename: "mock_notification.go"
  lfiber/internal/infra/notification/channel/sms:
    interfaces:
      Driver:
        config:
          structname: "MockSMSDriver"
          filename: "mock_sms_driver.go"
  lfiber/internal/infra/notification/channel/mail:
    interfaces:
      Driver:
        config:
          structname: "MockMailDriver"
          filename: "mock_mail_driver.go"
  lfiber/internal/infra/notification/channel/chat:
    interfaces:
      Driver:
        config:
          structname: "MockChatDriver"
          filename: "mock_chat_driver.go"
  lfiber/internal/infra/lock:
    interfaces:
      Locker:
      Lock:
  lfiber/internal/infra/storage:
    interfaces:
      Disk:
      Manager:
        config:
          structname: "MockStorageManager"
          filename: "mock_storage_manager.go"
  lfiber/internal/infra/realtime:
    interfaces:
      Manager:
        config:
          structname: "MockRealtimeManager"
          filename: "mock_realtime_manager.go"
  lfiber/internal/infra/search:
    interfaces:
      Manager:
        config:
          structname: "MockSearchManager"
          filename: "mock_search_manager.go"
      Engine:
  lfiber/internal/infra/mqtt:
    interfaces:
      Client:
        config:
          structname: "MockMQTTClient"
          filename: "mock_mqtt_client.go"
