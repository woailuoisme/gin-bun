apiVersion: v2
name: bgin
description: A production-ready Helm chart for bgin (Go Gin RESTful Web API)
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - bgin
  - gin
  - golang
  - rest-api
home: https://cnb.cool/ailuoga/gin-bun
sources:
  - https://cnb.cool/ailuoga/gin-bun
maintainers:
  - name: ailuoga
icon: https://raw.githubusercontent.com/gin-gonic/logo/master/color.png

dependencies:
  - name: postgresql
    version: "16.4.15"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: postgresql.enabled
  - name: valkey
    version: "6.3.4"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: valkey.enabled
