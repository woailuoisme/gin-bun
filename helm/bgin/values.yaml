# ==============================================================================
# bgin Helm Chart 生产级配置清单
# ==============================================================================

# 全局镜像配置
image:
  repository: docker.cnb.cool/ailuoga/gin-bun
  pullPolicy: IfNotPresent
  # 留空时默认取 Chart.yaml 的 appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

commonLabels: {}

# ServiceAccount 设定
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod 级安全上下文（非 root 用户 UID 10001，与 Dockerfile 保持一致）
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# 容器级安全上下文（最小特权原则）
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ------------------------------------------------------------------------------
# API 服务组件 (RESTful Web API)
# ------------------------------------------------------------------------------
api:
  enabled: true
  replicaCount: 2
  command:
    - /app/bgin
    - serve
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 3300

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: api.bgin.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
      # - secretName: bgin-tls
      #   hosts:
      #     - api.bgin.local

  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  livenessProbe:
    httpGet:
      path: /livez
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# ------------------------------------------------------------------------------
# Worker 异步队列处理组件 (Asynq / Redis)
# ------------------------------------------------------------------------------
worker:
  enabled: true
  replicaCount: 1
  command:
    - /app/bgin
    - queue:work
  args:
    - -q
    - critical:6,default:3,low:1

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 85

# ------------------------------------------------------------------------------
# 数据库版本迁移 Job (Helm 生命周期 Hook)
# ------------------------------------------------------------------------------
migration:
  enabled: true
  # Hook 阶段配置说明：
  # - 默认使用 "post-install,pre-upgrade"：兼容启用内置子 Chart（如 postgresql.enabled: true）时，
  #   首次安装需等待 PostgreSQL 实例就绪后再执行迁移，升级时在 Pod 滚动前先行完成 DDL 迁移。
  # - 若生产环境直连外部托管数据库（如 RDS / 云数据库），推荐改为 "pre-install,pre-upgrade"。
  hook: "post-install,pre-upgrade"
  hookDeletePolicy: "before-hook-creation,hook-succeeded"
  hookWeight: "-1"
  backoffLimit: 2
  command:
    - /app/bgin
    - db:migrate

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi

# ------------------------------------------------------------------------------
# 环境变量配置 (ConfigMap)
# ------------------------------------------------------------------------------
env:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_PORT: "3300"
  APP_HOST: "0.0.0.0"
  APP_TIMEZONE: "Asia/Shanghai"
  APP_URL: "https://api.bgin.local"
  ENABLE_DOCS: "false"
  CORS_ALLOWED_ORIGINS: "*"

  LOG_CHANNEL: "json"
  LOG_LEVEL: "info"

  RATELIMIT_ENABLED: "true"
  RATELIMIT_ANONYMOUS: "60"
  RATELIMIT_AUTHENTICATED: "300"
  RATELIMIT_SENSITIVE: "10"

  MAIL_ENABLED: "false"
  MAIL_DRIVER: "null"
  MAIL_FROM_ADDRESS: "no-reply@bgin.local"
  MAIL_FROM_NAME: "bgin"

  FILESYSTEM_DISK: "s3"
  AWS_ENDPOINT: "127.0.0.1:3900"
  AWS_BUCKET: "bgin"
  AWS_DEFAULT_REGION: "garage"
  AWS_USE_SSL: "false"

  SCOUT_DRIVER: "meilisearch"
  SCOUT_PREFIX: "bgin_"

  CENTRIFUGO_ENABLED: "false"
  CENTRIFUGO_URL: "http://centrifugo:8000/api"

  OTEL_ENABLED: "false"
  TEMPORAL_ENABLED: "false"

# ------------------------------------------------------------------------------
# 敏感凭据配置 (Secret)
# ------------------------------------------------------------------------------
# 若指定 existingSecret，Chart 将跳过创建内置 Secret，直接引用外部预置 Secret
existingSecret: ""

# 内置 Secret 键值（留空时不渲染该键）
secrets:
  JWT_SECRET: ""
  DB_URL: "postgres://postgres:secret@postgres-postgresql:5432/bgin?sslmode=disable"
  REDIS_URL: "redis://:redis_secret@valkey:6379/0"
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  MEILISEARCH_KEY: ""
  CENTRIFUGO_API_KEY: ""
  CENTRIFUGO_SECRET: ""
  SEED_ADMIN_PASSWORD: ""

# 附加自定义环境变量
extraEnv: []
# 附加自定义环境变量来源 (Secret / ConfigMap Ref)
extraEnvFrom: []

# 卷挂载（持久化日志或文件缓存）
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# ------------------------------------------------------------------------------
# 可选子 Chart（本地研发 / Kind / K3s 测试自举开启）
# ------------------------------------------------------------------------------
postgresql:
  enabled: false
  auth:
    postgresPassword: "secretpassword"
    database: "bgin"

valkey:
  enabled: false
  auth:
    password: "secretpassword"
