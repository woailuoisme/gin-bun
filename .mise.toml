[tools]
# Go 运行时与工具链
go = "latest"
air = "latest"                                     # 热重载工具
golangci-lint = "2"                                # 静态检查与统一格式化器
"go:golang.org/x/tools/cmd/goimports" = "latest"   # Import 组织与管理
"go:golang.org/x/tools/cmd/gonew" = "latest"       # 脚手架项目实例化
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"  # 依赖漏洞扫描
"go:golang.org/x/tools/cmd/deadcode" = "latest"    # 死代码分析
"go:github.com/oligot/go-mod-upgrade" = "latest"   # 交互式依赖升级
"go:github.com/oasdiff/oasdiff" = "latest"         # OpenAPI 规范差异比对
gotestsum = "latest"                               # 测试结果摘要
swag = "1.16.6"                                    # 钉稳定版本保证 OpenAPI 生成一致

# 容器与打包
ko = "latest"                                      # Go 容器镜像极速构建

# 数据库迁移
atlas = "latest"                                   # 声明式 schema 迁移管理

# CI 检查与任务并发
actionlint = "latest"                              # GitHub Actions 流程校验
"npm:concurrently" = "latest"                      # 多任务并发执行

[settings]
npm.package_manager = "bun"

[env]
_.file = ".env"
