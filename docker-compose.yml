services:
  app:
    build:
      # 构建上下文即仓库根：Dockerfile 需读取 go.mod、cmd/ 等源码树
      context: .
      dockerfile: Dockerfile
    image: bgin:local
    container_name: bgin-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3300}:3300"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: 3300
      APP_HOST: 0.0.0.0
    volumes:
      - ./storage:/app/storage

networks:
  default:
    name: backend
    external: true
