# ==============================================================================
# bgin 环境敏感配置示例模板 (secrets.example.yaml)
# ==============================================================================
# 使用说明：
# 1. 复制本文件为目标环境未加密文件：
#    cp helm/bgin/secrets.example.yaml helm/bgin/secrets.prod.yaml
# 2. 填入真实敏感凭证，然后运行 SOPS 进行加密：
#    just sops-encrypt prod
# 3. 生成的 secrets.prod.enc.yaml 可安全提交至 Git 仓库。
# 4. 部署时通过 -f 传入：
#    helm upgrade -i bgin ./helm/bgin -f values.yaml -f <(sops -d helm/bgin/secrets.prod.enc.yaml)
# ==============================================================================

secrets:
  # 应用 JWT 签名秘钥（必须为强随机字符串，生产建议至少 32 字符）
  JWT_SECRET: "change-this-to-a-super-secret-jwt-signing-key-32chars"

  # PostgreSQL 数据库连接串（生产建议开启 sslmode=require 或 verify-full）
  DB_URL: "postgres://bgin_user:your_strong_db_password@pg-cluster.internal:5432/bgin_prod?sslmode=disable"

  # Redis / Valkey 缓存连接串
  REDIS_URL: "redis://:your_strong_redis_auth@valkey-cluster.internal:6379/0"

  # S3 / MinIO 对象存储访问凭证
  AWS_ACCESS_KEY_ID: "your-s3-access-key-id"
  AWS_SECRET_ACCESS_KEY: "your-s3-secret-access-key"

  # 全文检索 Meilisearch Master Key
  MEILISEARCH_KEY: "your-meilisearch-master-key"

  # Centrifugo 实时通信服务凭证
  CENTRIFUGO_API_KEY: "your-centrifugo-api-key"
  CENTRIFUGO_SECRET: "your-centrifugo-secret"

  # 数据库首次播种管理员密码（仅在 db:seed 时使用）
  SEED_ADMIN_PASSWORD: "AdminSecurePassword123!"
