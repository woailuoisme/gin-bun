name: Docker Build and Push

on:
  # push:
  #   branches:
  #     - main
  #   tags:
  #     - 'v*'
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      docker_username:
        description: 'Docker Hub Username'
        type: string
        default: 'jiaoio'
      image_name:
        description: 'Docker Image Name'
        type: string
        default: 'bgin'

env:
  DOCKERHUB_USERNAME: 'jiaoio'
  IMAGE_NAME: 'bgin'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.docker_username || env.DOCKERHUB_USERNAME }}/${{ inputs.image_name || env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.docker_username || env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 多架构编译
          platforms: linux/amd64,linux/arm64
          # PR 仅做构建测试，非 PR（push to main、tag 或 workflow_dispatch）才执行推送
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ inputs.docker_username || env.DOCKERHUB_USERNAME }}/${{ inputs.image_name || env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ inputs.docker_username || env.DOCKERHUB_USERNAME }}/${{ inputs.image_name || env.IMAGE_NAME }}:cache,mode=max
